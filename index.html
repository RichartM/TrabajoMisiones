<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Misiones</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <h1 class="text-center mt-5">Misiones</h1>

  <!-- feature: dom -->
  <section id="dom" class="container my-5" aria-labelledby="dom-title">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h2 id="dom-title" class="card-title h3">Laboratorio DOM</h2>
        <p class="card-text text-secondary">Crea una lista de refugios y elimina el último cuando ya no sea necesario.</p>

        <div class="d-flex flex-wrap gap-2 mb-3">
          <button id="add-shelter" class="btn btn-success" type="button">Agregar elemento</button>
          <button id="remove-shelter" class="btn btn-outline-danger" type="button">Eliminar último</button>
        </div>

        <p class="mb-2" aria-live="polite">
          Elementos registrados: <strong id="shelter-count">0</strong>
        </p>
        <ul id="shelter-list" class="list-group" aria-label="Lista de refugios"></ul>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
